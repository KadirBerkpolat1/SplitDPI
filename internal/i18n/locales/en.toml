# English is the source locale. Keys may use dotted names or [tables].

[usage]
header = "Usage: splitdpi [--lang en|tr] <command> [args]"
commands = "Commands:"

[err]
need_root = "This command needs root. Run: %s"
unknown_command = "Unknown command: %s"
lang_value = "--lang needs a value: en or tr"

[cmd.version]
help = "Print the version."

[cmd.engine]
help = "Install (install [--from FILE]) or show (status) the pinned zapret2 engine."

[engine]
usage = "Usage: splitdpi engine install [--from FILE] | splitdpi engine status"
downloading = "Downloading %s"
installed = "Installed zapret2 %s in %s"
not_installed = "The engine is not installed. Run: sudo splitdpi engine install"
status = "Engine: zapret2 %s\nDirectory: %s"
pin_ok = "Matches the pinned version."
pin_mismatch = "Differs from the pinned version %s. Run: sudo splitdpi engine install"
download_hint = "If the download is blocked, get %s another way and run: sudo splitdpi engine install --from FILE"

[cmd.presets]
help = "Show, refresh or validate preset data (list | update | check DIR)."

[cmd.apps]
help = "List, enable or disable app profiles (list | enable ID | disable ID)."

[cmd.exclude]
help = "Manage domains never touched by the bypass (list | add DOMAIN | remove DOMAIN)."

[cmd.sites]
help = "Manage your own blocked sites, which the bypass always handles (list | add DOMAIN | remove DOMAIN)."

[cmd.strategy]
help = "List the preset strategies or choose one (list | set ID)."

[cmd.probe]
help = "Test HTTPS reachability of enabled app probe URLs and your sites."

[probe]
usage = "Usage: splitdpi probe [--apps id,id] [-v]"
no_apps = "No apps enabled and no sites added. Run: sudo splitdpi apps enable discord  or: sudo splitdpi sites add DOMAIN"
failed = "One or more probes failed."
dns.mismatch = "system and DoH disagree"

[cmd.scan]
help = "Find a working DPI strategy for your ISP (preset trials, then blockcheck2), or for one site (--site DOMAIN)."

[scan]
usage = "Usage: splitdpi scan [--asn N] [--country CC] [--apps id,id] [--site DOMAIN] [--blockcheck-only] [--no-blockcheck] [-v]"
site_ipv4 = "Scanning %s with blockcheck2 over IPv4 only: this machine has no global IPv6."
site_ipv46 = "Scanning %s with blockcheck2 over IPv4 and IPv6."
verify = "Re-testing %d blockcheck2 strategies on your apps and sites; the first that opens all of them is saved."
locked = "splitdpi is already running. Stop it first: sudo splitdpi stop"
no_strategy = "No working strategy found."
winner = "Selected strategy: %s (from %s)"
voice = "voice: preset applied, not verified"
next = "Next: sudo splitdpi run   or: sudo splitdpi enable"
presets_stale = "Preset data is over 30 days old. Consider: splitdpi presets update"

[cmd.detect]
help = "Look up your ASN and list matching ISP preset strategies."

[detect]
usage = "Usage: splitdpi detect [--asn N] [--country CC]"
asking = "Asking %s …"
result = "AS%d %s — %s"
isp = "ISP preset: %s"
candidates = "Candidate strategies:"

[presets]
usage = "Usage: splitdpi presets list | update | check DIR"
