check.ok = "Presets OK: version %s, %d ISPs, %d apps."
update.fetching = "Fetching %s"
update.done = "Updated preset cache to version %s (%d apps)."
header = "Presets: %s, version %s"
isps = "ISPs:"
strategies = "strategies: %d"
apps = "Apps:"
countries = "Countries: %s"
generic = "Generic strategies: %d"
warnings = "Skipped files:"

[apps]
usage = "Usage: splitdpi apps list | enable ID | disable ID"
unknown = "Unknown app %q. Known apps: %s"
enabled = "Enabled %s. Restart splitdpi to apply."
disabled = "Disabled %s. Restart splitdpi to apply."

[exclude]
usage = "Usage: splitdpi exclude list | add DOMAIN | remove DOMAIN"
added = "Excluded %s. Restart splitdpi to apply."
removed = "Removed %s from exclusions. Restart splitdpi to apply."

[domain]
empty = "No domain given."
invalid = "%q is not a valid domain name."

[sites]
usage = "Usage: splitdpi sites list | add DOMAIN | remove DOMAIN"
added = "Added %s to your sites. Restart splitdpi to apply."
removed = "Removed %s from your sites. Restart splitdpi to apply."

[strategy]
usage = "Usage: splitdpi strategy list | set ID"
unknown = "Unknown strategy %q. See: splitdpi strategy list"
set = "Strategy set to %s (%s)."
restart = "splitdpi is running: restart it to apply: sudo splitdpi stop && sudo splitdpi run"
current = "Current strategy: %s (from %s)"
from_country = "%s country-wide"
from_generic = "generic"

[cmd.doctor]
help = "Check this machine for everything splitdpi needs."

[doctor]
usage = "Usage: splitdpi doctor"
fix = "fix: %s"
blockers = "doctor found %d blocker(s); fix them before running splitdpi."

[doctor.root]
ok = "running as root"
no = "not running as root"

[doctor.kernel]
ok = "kernel %s"
old = "kernel %s is older than %d.%d"
unknown = "cannot read the kernel version: %v"

[doctor.tool]
ok = "%s found at %s"
missing.nft = "nft (nftables) is not installed; splitdpi needs it to queue traffic"
missing.curl = "curl is not installed; scan (blockcheck2) needs it"

[doctor.nfqueue]
ok = "the kernel accepts nftables queue rules"
fail = "the kernel rejected a test queue rule (NFQUEUE support missing?): %v"

[doctor.engine]
ok = "zapret2 %s in %s"
missing = "the zapret2 engine is not installed"
old = "installed engine %s differs from the pinned zapret2 %s"

[doctor.strategy]
ok = "saved strategy matches the pinned engine"
old = "saved strategy used engine %s; pinned engine is %s"

[doctor.lsm]
ok = "SELinux %s, AppArmor enabled: %t"
enforcing = "SELinux is enforcing; %d denial(s) for nfqws2/splitdpi in %s"
enforcing_clean = "SELinux is enforcing; 0 denials for nfqws2/splitdpi in %s"
enforcing_nolog = "SELinux is enforcing; cannot read the audit log or dmesg to count denials: %v"

[doctor.conflict]
none = "no other DPI-bypass tools found"
process = "%s is running (another DPI-bypass tool); stop it and its service first"
dir = "%s exists (an old zapret install)"
dir_pkg = "%s exists (probably a distro package); remove that package with your package manager"
resolv = "/etc/resolv.conf is immutable (set by another tool); DNS changes will fail"

[doctor.init]
ok = "init system: %s"
other = "unknown init system: service mode unsupported; use `splitdpi run`"

[doctor.ipv6]
yes = "global IPv6 present (default route and address)"
no = "no global IPv6; scans test IPv4 only"

[doctor.dns]
ok = "no DNS poisoning detected for enabled apps"
poisoned = "DNS poisoning for %s: %s"

[cmd.run]
help = "Run the bypass in the foreground (Ctrl-C stops it and removes the rules)."

[cmd.stop]
help = "Stop the running bypass."

[cmd.status]
help = "Show whether the bypass runs, with strategy, engine, apps and the last error."

[cmd.revert]
help = "Remove every splitdpi firewall rule and run file ([--purge] also config and data)."

[run]
usage = "Usage: splitdpi run [--service]"
conflict = "Another DPI-bypass tool is running. Stop it first, then run splitdpi again."
