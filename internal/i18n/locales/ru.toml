[probeerr.reset]
what = "Провайдер блокирует этот сайт: соединение было разорвано."
todo = "Попробуйте другую стратегию с помощью сканирования: sudo splitdpi scan"

[probeerr.timeout]
what = "Сайт не ответил вовремя."
todo = "Провайдер может молча отбрасывать трафик, или сайт недоступен. Попробуйте сканирование: sudo splitdpi scan. Если медленно открываются все сайты, проверьте подключение к интернету."

[probeerr.dns]
what = "Не удалось узнать адрес сайта: DNS не ответил или ответ был подменён."
todo = "Включите зашифрованный DNS и перезапустите splitdpi: sudo splitdpi dns auto"

[probeerr.tls]
what = "Не удалось установить защищённое соединение: сертификат не совпал с сайтом или рукопожатие прервалось."
todo = "Провайдер может перенаправлять сайт. Включите зашифрованный DNS (sudo splitdpi dns auto), затем попробуйте сканирование: sudo splitdpi scan"

[probeerr.http]
what = "Вместо сайта ответило что-то другое, вероятно страница блокировки провайдера."
todo = "Попробуйте сканирование: sudo splitdpi scan. Если это повторяется, включите зашифрованный DNS: sudo splitdpi dns auto"

[probeerr.other]
what = "Соединение не удалось по другой причине."
todo = "Запустите команду снова с -v, чтобы увидеть ошибку, и проверьте, открывается ли сайт вообще."

[share]
