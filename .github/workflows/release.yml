name: release

on:
  push:
    tags:
      - v*

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build linux amd64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/KadirBerkpolat1/SplitDPI/internal/cli.Version=$TAG" \
            -o splitdpi-linux-amd64 ./cmd/splitdpi
      - name: Build linux arm64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/KadirBerkpolat1/SplitDPI/internal/cli.Version=$TAG" \
            -o splitdpi-linux-arm64 ./cmd/splitdpi
      - run: sha256sum splitdpi-linux-amd64 splitdpi-linux-arm64 > sha256sums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          args=(gh release create "$TAG" splitdpi-linux-amd64 splitdpi-linux-arm64 sha256sums.txt --generate-notes)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          "${args[@]}"
